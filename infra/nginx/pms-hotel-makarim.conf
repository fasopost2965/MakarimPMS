# Reverse proxy Nginx hôte (hors Docker) — VPS Hostinger, CH-046.
#
# Reprend le schéma déjà validé dans docs/operations/CH-026E_DEPLOIEMENT_DOMAINE.md
# §4 (domaine/sous-domaines, cookies host-only, certificat SAN Certbot) et y ajoute
# les en-têtes de sécurité exigés par docs/execution/GO_LIVE_CHECKLIST.md point 6
# (HSTS, X-Frame-Options, X-Content-Type-Options).
#
# Remplacer <domaine> par le nom de domaine réel une fois choisi/enregistré (voir
# CH-026E §1 — pms.<domaine> / api.<domaine>, même domaine enregistrable, pas de
# valeur réelle assumée ici). Installer à /etc/nginx/sites-available/ sur le VPS,
# lier dans sites-enabled, puis générer le certificat SAN :
#   sudo certbot --nginx -d pms.<domaine> -d api.<domaine>

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pms.<domaine>;

    ssl_certificate     /etc/letsencrypt/live/<domaine>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<domaine>/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.<domaine>;

    ssl_certificate     /etc/letsencrypt/live/<domaine>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<domaine>/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pms.<domaine> api.<domaine>;
    return 301 https://$host$request_uri;
}

# Mode maintenance (docs/operations/OPERATIONS_RUNBOOK.md §6.2, restauration base de
# données) : commenter temporairement les deux blocs `location /` ci-dessus et les
# remplacer par le bloc suivant dans chacun des deux serveurs HTTPS, puis
# `sudo nginx -t && sudo systemctl reload nginx` :
#
#     location / {
#         return 503;
#     }
#     error_page 503 /maintenance.html;
#     location = /maintenance.html {
#         root /var/www/maintenance;
#         internal;
#     }
